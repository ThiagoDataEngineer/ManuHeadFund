<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="300">
    <title>Position Management Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: white; padding: 30px; border-radius: 15px; margin-bottom: 30px; text-align: center; }
        .header h1 { color: #667eea; font-size: 2.5em; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: white; padding: 25px; border-radius: 15px; }
        .metric-card .label { font-size: 0.9em; color: #666; text-transform: uppercase; }
        .metric-card .value { font-size: 2.5em; font-weight: bold; color: #667eea; }
        .metric-card.positive .value { color: #10b981; }
        .metric-card.negative .value { color: #ef4444; }
        .section { background: white; padding: 30px; border-radius: 15px; margin-bottom: 30px; }
        .section h2 { color: #667eea; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; color: #667eea; font-weight: 600; }
        .positive { color: #10b981; font-weight: bold; }
        .negative { color: #ef4444; font-weight: bold; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .badge.long { background: #d1fae5; color: #065f46; }
        .badge.short { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Position Management Dashboard</h1>
            <div>Ultima atualizacao: 2026-05-23 14:44:07</div>
        </div>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="label">Posicoes Abertas</div>
                <div class='value'>1</div>
            </div>
            <div class="metric-card">
                <div class="label">Total de Trades</div>
                <div class='value'>100</div>
            </div>
            <div class="metric-card positive">
                <div class="label">Win Rate</div>
                <div class='value'>49%</div>
            </div>
            <div class='metric-card negative'>
                <div class="label">PnL Total</div>
                <div class='value'>$-612.72</div>
            </div>
        </div>
        <div class="section">
            <h2>Posicoes Abertas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Market</th>
                        <th>Side</th>
                        <th>Entry</th>
                        <th>Current</th>
                        <th>PnL%</th>
                        <th>Leverage</th>
                        <th>Liquidation</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>BNBUSDT</strong></td>
                        <td><span class='badge long'>LONG</span></td>
                        <td>$647.06</td>
                        <td>$648.32</td>
                        <td class='positive'>0.19%</td>
                        <td>50x</td>
                        <td>$0</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
