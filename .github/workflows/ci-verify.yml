# CI-VERIFY — Tratamento de causa raiz 2026-07-04
# 13 bugs em 48h tinham a MESMA raiz: falha silenciosa + zero verificacao de
# contrato entre componentes. Este CI roda em TODO push e bloqueia a classe:
#   1. PARSE PS de todos os agents/scripts (pega mojibake/BOM/sintaxe)
#   2. INVARIANTES estaticos (enum de cenario, direcao nos gates, flags alcancaveis)
#   3. CONTRATO de dependencias (toda funcao chamada existe; ratchet c/ baseline)
#   4. Suites Pester criticas (beta, pump-fade, regime-aware)
# Vermelho aqui = NAO declarar "consertado".

name: CI Verify (contratos + invariantes)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Parse + Invariantes + Contratos + Pester
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 1. Parse PS de todos os arquivos operacionais
        shell: powershell
        run: |
          $quarantine = @("setup_telegram.ps1","start_services.ps1","trailing_long.ps1")
          $fails = @()
          $files = @(Get-ChildItem agents\*.ps1) + @(Get-ChildItem scripts\*.ps1)
          foreach ($f in $files) {
            if ($f.Name -in $quarantine) { continue }
            $t=$null;$e=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$t,[ref]$e)
            if ($e.Count -gt 0) { $fails += "$($f.Name): $($e[0].Message)" }
          }
          if ($fails) { $fails | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "PARSE OK: $($files.Count) arquivos"

      - name: 2. Instalar Pester 3.x-compat runner
        shell: powershell
        run: |
          # O repo usa sintaxe Pester 3.4 (Should Be). windows-latest tem Pester 3.4 embutido no Windows PowerShell.
          Get-Module -ListAvailable Pester | Select-Object -First 1 Name, Version | Out-String

      - name: 3. Invariantes estaticos (classe de bugs 2026-07-03)
        shell: powershell
        run: |
          $r = Invoke-Pester tests\gate_invariants_static.Tests.ps1 -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: 4. Contrato de dependencias (funcoes chamadas existem)
        shell: powershell
        run: |
          $r = Invoke-Pester tests\contract_dependencies.Tests.ps1 -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: 5. Suites Pester criticas
        shell: powershell
        run: |
          # 2026-07-09: +libs_parse_clean (18 libs quebradas em silencio), +capital_context_failsafe
          # (JOB17 poluia Supabase com bootstrap), +boot_integrity (daemons fail-closed no boot)
          # 2026-07-16 (auditoria agent a395f05e): +gem_executor.Tests.ps1 -- suite que
          # valida o caminho pos-gates de Invoke-GemExecute (roteamento SPOT/FUTURES,
          # sizing, stop/target, guard SHORT-em-SPOT) NUNCA esteve nesta lista. Ficou
          # 11/24 quebrada em silencio por semanas (mocks das 3 gates paralelas de
          # 2026-07-15 ausentes) sem o CI nunca acusar -- exatamente a classe de bug
          # que esta lista existe pra prevenir.
          $suites = "tests\lib_pump_fade_detector.Tests.ps1","tests\beta_hallucination_fix.Tests.ps1","tests\lib_beta_cap_regime_aware.Tests.ps1","tests\lib_evolution_engine.Tests.ps1","tests\lib_crowding_signal.Tests.ps1","tests\libs_parse_clean.Tests.ps1","tests\capital_context_failsafe.Tests.ps1","tests\boot_integrity.Tests.ps1","tests\gem_executor.Tests.ps1"
          $failed = 0
          foreach ($s in $suites) {
            if (Test-Path $s) {
              $r = Invoke-Pester $s -PassThru
              Write-Host "$s => $($r.PassedCount)/$($r.TotalCount)"
              $failed += $r.FailedCount
            }
          }
          if ($failed -gt 0) { exit 1 }
