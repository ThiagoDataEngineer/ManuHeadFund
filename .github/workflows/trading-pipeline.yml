          $content | Out-File "agents/config.local.ps1" -Encoding UTF8

      - name: Run Conviction Scan (hourly at :20, observe)
        shell: pwsh
        continue-on-error: true
        run: |
          $minute = (Get-Date).Minute
          if ($minute -ge 20 -and $minute -lt 25) {
            Write-Host "=== CLOUD CONVICTION SCAN (OBSERVE) ===" -ForegroundColor Cyan
            try {
