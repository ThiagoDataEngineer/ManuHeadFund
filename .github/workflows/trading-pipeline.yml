  # ============================================================================
  # JOB 6: HEALTH CHECK
  # ============================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [trailing-stop-monitor, position-risk, dashboard, deploy-dashboard, short-scanner]
    if: always()
    
    steps:
      - name: Check APIs
        shell: pwsh
        run: |
          Write-Host "=== HEALTH CHECK ===" -ForegroundColor Cyan
          
          try {
            Invoke-RestMethod -Uri "https://api.coinex.com/v2/ping" | Out-Null
            Write-Host "CoinEx API: OK" -ForegroundColor Green
          } catch {
            Write-Host "CoinEx API: FAILED" -ForegroundColor Red
          }
          
          try {
            $token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            $r = Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/getMe"
            Write-Host "Telegram API: OK - $($r.result.username)" -ForegroundColor Green
          } catch {
            Write-Host "Telegram API: FAILED" -ForegroundColor Red
          }
      
      - name: Alert on Failure
        if: failure() || needs.trailing-stop-monitor.result == 'failure' || needs.position-risk.result == 'failure'
        shell: pwsh
        run: |
          try {
            $token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            $chatId = "${{ secrets.TELEGRAM_CHAT_ID }}"
            
            $msg = "ðŸš¨ GITHUB ACTIONS ALERT`n`n"
            $msg += "Trailing Stop: ${{ needs.trailing-stop-monitor.result }}`n"
            $msg += "Position Risk: ${{ needs.position-risk.result }}`n"
            $msg += "Dashboard: ${{ needs.dashboard.result }}`n"
            $msg += "Deploy Pages: ${{ needs.deploy-dashboard.result }}`n"
            $msg += "Short Scanner: ${{ needs.short-scanner.result }}`n`n"
            $msg += "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
            $body = @{ chat_id = $chatId; text = $msg } | ConvertTo-Json
            
            Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/sendMessage" `
              -Method Post -Body $body -ContentType "application/json" | Out-Null
              
            Write-Host "Alert sent" -ForegroundColor Green
          } catch {
            Write-Host "Failed to send alert: $_" -ForegroundColor Red
          }




