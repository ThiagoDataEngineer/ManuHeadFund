      - name: Run
        shell: pwsh
        continue-on-error: true
        run: |
          # Observatory: alimenta journal + learning. Roda em todo fire (scan barato).
          Write-Host "=== EARLY WARNING SCAN ===" -ForegroundColor Cyan
          try {
            & ./scripts/early_warning_scan.ps1
            Write-Host "OK" -ForegroundColor Green
          } catch {
            Write-Host "WARN: $_" -ForegroundColor Yellow
          }

  # ============================================================================
  # JOB 6c: OPPORTUNISTIC SHORT SCAN (downtrends obvios -10%+ 24h — OBSERVATORY)
  # 2026-06-30: momentum SHORT em BEAR, complementar ao vol_climax. So loga + TG.
  # ============================================================================
  opportunistic-short-scan:
    name: Opportunistic Short Scan (Observatory)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
