# GitHub Actions - ManuHeadFund Trading Pipeline COMPLETO
# Sistema 100% independente da máquina local
# Roda na nuvem 24/7

name: Trading Pipeline Complete

on:
  schedule:
    # A cada 5 minutos (crítico)
    - cron: '*/5 * * * *'
  
  workflow_dispatch:

jobs:
  # ============================================================================
  # JOB 1: TRAILING STOP MONITOR (Crítico - a cada 5min)
  # ============================================================================
  trailing-stop-monitor:
    name: Trailing Stop Monitor
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "agents","journal","logs" -Force | Out-Null
          $content = "`$env:COINEX_ACCESS_ID = '${{ secrets.COINEX_ACCESS_ID }}'" + "`n"
          $content += "`$env:COINEX_SECRET_KEY = '${{ secrets.COINEX_SECRET_KEY }}'" + "`n"
          $content += "`$env:TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}'" + "`n"
          $content += "`$env:TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8
      
      - name: Run
        shell: pwsh
        run: |
          try {
            Write-Host "=== TRAILING STOP ===" -ForegroundColor Cyan
            & ./scripts/trailing_stop_monitor.ps1
            Write-Host "OK" -ForegroundColor Green
          } catch {
            Write-Host "ERRO: $_" -ForegroundColor Red
            throw
          }
  
  # ============================================================================
  # JOB 2: POSITION RISK MANAGER (a cada 15min)
  # ============================================================================
  position-risk:
    name: Position Risk Manager
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "agents","journal","logs" -Force | Out-Null
          $content = "`$env:COINEX_ACCESS_ID = '${{ secrets.COINEX_ACCESS_ID }}'" + "`n"
          $content += "`$env:COINEX_SECRET_KEY = '${{ secrets.COINEX_SECRET_KEY }}'" + "`n"
          $content += "`$env:TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}'" + "`n"
          $content += "`$env:TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8
      
      - name: Run
        shell: pwsh
        run: |
          try {
            $minute = (Get-Date).Minute
            if ($minute % 15 -eq 0) {
              Write-Host "=== POSITION RISK ===" -ForegroundColor Cyan
              & ./scripts/position_risk_cron.ps1
              Write-Host "OK" -ForegroundColor Green
            } else {
              Write-Host "Skipped (runs every 15min)" -ForegroundColor Yellow
            }
          } catch {
            Write-Host "ERRO: $_" -ForegroundColor Red
            throw
          }
  
  # ============================================================================
  # JOB 3: DASHBOARD (a cada 5min)
  # ============================================================================
  dashboard:
    name: Dashboard Generator
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "agents","journal","logs","dashboard" -Force | Out-Null
          $content = "`$env:COINEX_ACCESS_ID = '${{ secrets.COINEX_ACCESS_ID }}'" + "`n"
          $content += "`$env:COINEX_SECRET_KEY = '${{ secrets.COINEX_SECRET_KEY }}'" + "`n"
          $content += "`$env:TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}'" + "`n"
          $content += "`$env:TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8
      
      - name: Run
        shell: pwsh
        run: |
          try {
            Write-Host "=== DASHBOARD ===" -ForegroundColor Cyan
            & ./scripts/collect_dashboard_data.ps1
            Write-Host "OK" -ForegroundColor Green
          } catch {
            Write-Host "ERRO: $_" -ForegroundColor Red
          }
      
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_number }}
          path: dashboard/
          retention-days: 7
  
  # ============================================================================
  # JOB 4: DEPLOY DASHBOARD TO GITHUB PAGES
  # ============================================================================
  deploy-dashboard:
    name: Deploy Dashboard to GitHub Pages
    runs-on: ubuntu-latest
    needs: [dashboard]
    if: success()
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard-${{ github.run_number }}
          path: ./public
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
  
  # ============================================================================
  # JOB 5: SHORT SCANNER (a cada hora)
  # ============================================================================
  short-scanner:
    name: Short Scanner
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "agents","journal","logs" -Force | Out-Null
          $content = "`$env:COINEX_ACCESS_ID = '${{ secrets.COINEX_ACCESS_ID }}'" + "`n"
          $content += "`$env:COINEX_SECRET_KEY = '${{ secrets.COINEX_SECRET_KEY }}'" + "`n"
          $content += "`$env:TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}'" + "`n"
          $content += "`$env:TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8
      
      - name: Run
        shell: pwsh
        run: |
          try {
            $minute = (Get-Date).Minute
            if ($minute -eq 0) {
              Write-Host "=== SHORT SCANNER ===" -ForegroundColor Cyan
              & ./scripts/short_scanner.ps1
              Write-Host "OK" -ForegroundColor Green
            } else {
              Write-Host "Skipped (runs hourly)" -ForegroundColor Yellow
            }
          } catch {
            Write-Host "ERRO: $_" -ForegroundColor Red
          }

  # ============================================================================
  # JOB 7: WHALE WATCHER (a cada 30min)
  # ============================================================================
  whale-watcher:
    name: Whale Watcher
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "agents","journal","logs" -Force | Out-Null
          $content = "`$env:COINEX_ACCESS_ID = '${{ secrets.COINEX_ACCESS_ID }}'" + "`n"
          $content += "`$env:COINEX_SECRET_KEY = '${{ secrets.COINEX_SECRET_KEY }}'" + "`n"
          $content += "`$env:TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}'" + "`n"
          $content += "`$env:TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8
      
      - name: Run
        shell: pwsh
        continue-on-error: true
        run: |
          $minute = (Get-Date).Minute
          if ($minute -eq 0 -or $minute -eq 30) {
            Write-Host "=== WHALE WATCHER ===" -ForegroundColor Cyan
            try {
              & ./scripts/whale_watcher_cron.ps1 -DryRun
              Write-Host "OK" -ForegroundColor Green
            } catch {
              Write-Host "WARN: $_" -ForegroundColor Yellow
            }
          } else {
            Write-Host "Skipped (runs every 30min)" -ForegroundColor Yellow
          }

  # ============================================================================
  # JOB 8: STALENESS AUDIT (a cada 6h)
  # ============================================================================
  staleness-audit:
    name: Staleness Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "agents","journal","logs" -Force | Out-Null
          $content = "`$env:COINEX_ACCESS_ID = '${{ secrets.COINEX_ACCESS_ID }}'" + "`n"
          $content += "`$env:COINEX_SECRET_KEY = '${{ secrets.COINEX_SECRET_KEY }}'" + "`n"
          $content += "`$env:TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}'" + "`n"
          $content += "`$env:TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8
      
      - name: Run
        shell: pwsh
        continue-on-error: true
        run: |
          $hour = (Get-Date).Hour
          $minute = (Get-Date).Minute
          # Roda a cada 6h (0, 6, 12, 18) no minuto 0
          if (($hour % 6 -eq 0) -and $minute -eq 0) {
            Write-Host "=== STALENESS AUDIT ===" -ForegroundColor Cyan
            try {
              & ./scripts/cron_staleness_audit.ps1 -SendTg
              Write-Host "OK" -ForegroundColor Green
            } catch {
              Write-Host "WARN: $_" -ForegroundColor Yellow
            }
          } else {
            Write-Host "Skipped (runs every 6h)" -ForegroundColor Yellow
          }

  # ============================================================================
  # JOB 9: KELLY AUDIT (1x/dia)
  # ============================================================================
  kelly-audit:
    name: Kelly Graduation Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "agents","journal","logs" -Force | Out-Null
          $content = "`$env:COINEX_ACCESS_ID = '${{ secrets.COINEX_ACCESS_ID }}'" + "`n"
          $content += "`$env:COINEX_SECRET_KEY = '${{ secrets.COINEX_SECRET_KEY }}'" + "`n"
          $content += "`$env:TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}'" + "`n"
          $content += "`$env:TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8
      
      - name: Run
        shell: pwsh
        continue-on-error: true
        run: |
          $hour = (Get-Date).Hour
          $minute = (Get-Date).Minute
          # Roda 1x/dia as 05:00 UTC (02:00 BRT)
          if ($hour -eq 5 -and $minute -eq 0) {
            Write-Host "=== KELLY AUDIT ===" -ForegroundColor Cyan
            try {
              & ./scripts/daily_kelly_audit.ps1
              Write-Host "OK" -ForegroundColor Green
            } catch {
              Write-Host "WARN: $_" -ForegroundColor Yellow
            }
          } else {
            Write-Host "Skipped (runs daily 05:00 UTC)" -ForegroundColor Yellow
          }

  # ============================================================================
  # JOB 10: DAILY DIGEST (1x/dia)
  # ============================================================================
  daily-digest:
    name: Daily Summary Digest
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "agents","journal","logs" -Force | Out-Null
          $content = "`$env:COINEX_ACCESS_ID = '${{ secrets.COINEX_ACCESS_ID }}'" + "`n"
          $content += "`$env:COINEX_SECRET_KEY = '${{ secrets.COINEX_SECRET_KEY }}'" + "`n"
          $content += "`$env:TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}'" + "`n"
          $content += "`$env:TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8
      
      - name: Run
        shell: pwsh
        continue-on-error: true
        run: |
          $hour = (Get-Date).Hour
          $minute = (Get-Date).Minute
          # Roda 1x/dia as 02:55 UTC (23:55 BRT)
          if ($hour -eq 2 -and $minute -eq 55) {
            Write-Host "=== DAILY DIGEST ===" -ForegroundColor Cyan
            try {
              & ./scripts/daily_summary_digest.ps1
              Write-Host "OK" -ForegroundColor Green
            } catch {
              Write-Host "WARN: $_" -ForegroundColor Yellow
            }
          } else {
            Write-Host "Skipped (runs daily 02:55 UTC)" -ForegroundColor Yellow
          }
  
  # ============================================================================
  # JOB 6: HEALTH CHECK
  # ============================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [trailing-stop-monitor, position-risk, dashboard, deploy-dashboard, short-scanner]
    if: always()
    
    steps:
      - name: Check APIs
        shell: pwsh
        run: |
          Write-Host "=== HEALTH CHECK ===" -ForegroundColor Cyan
          
          try {
            Invoke-RestMethod -Uri "https://api.coinex.com/v2/ping" | Out-Null
            Write-Host "CoinEx API: OK" -ForegroundColor Green
          } catch {
            Write-Host "CoinEx API: FAILED" -ForegroundColor Red
          }
          
          try {
            $token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            $r = Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/getMe"
            Write-Host "Telegram API: OK - $($r.result.username)" -ForegroundColor Green
          } catch {
            Write-Host "Telegram API: FAILED" -ForegroundColor Red
          }
      
      - name: Alert on Failure
        if: failure() || needs.trailing-stop-monitor.result == 'failure' || needs.position-risk.result == 'failure'
        shell: pwsh
        run: |
          try {
            $token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            $chatId = "${{ secrets.TELEGRAM_CHAT_ID }}"
            
            $msg = "🚨 GITHUB ACTIONS ALERT`n`n"
            $msg += "Trailing Stop: ${{ needs.trailing-stop-monitor.result }}`n"
            $msg += "Position Risk: ${{ needs.position-risk.result }}`n"
            $msg += "Dashboard: ${{ needs.dashboard.result }}`n"
            $msg += "Deploy Pages: ${{ needs.deploy-dashboard.result }}`n"
            $msg += "Short Scanner: ${{ needs.short-scanner.result }}`n`n"
            $msg += "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
            $body = @{ chat_id = $chatId; text = $msg } | ConvertTo-Json
            
            Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/sendMessage" `
              -Method Post -Body $body -ContentType "application/json" | Out-Null
              
            Write-Host "Alert sent" -ForegroundColor Green
          } catch {
            Write-Host "Failed to send alert: $_" -ForegroundColor Red
          }
