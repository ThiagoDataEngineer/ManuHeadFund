# GitHub Actions - ManuHeadFund Trading Pipeline
# Roda na nuvem sem depender da máquina local

name: Trading Pipeline

on:
  schedule:
    # A cada 15 minutos (failover quando máquina desligada)
    # Otimizado para limites gratuitos: ~2.880min/mês ✅
    - cron: '*/15 * * * *'
  
  # Permite execução manual
  workflow_dispatch:

jobs:
  risk-manager:
    name: Position Risk Manager
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion) instalado"
      
      - name: Configurar credenciais
        shell: pwsh
        run: |
          # Criar config.local.ps1 no formato correto
          $configContent = @"
# config.local.ps1 - GitHub Actions
`$env:COINEX_ACCESS_ID = "${{ secrets.COINEX_ACCESS_ID }}"
`$env:COINEX_SECRET_KEY = "${{ secrets.COINEX_SECRET_KEY }}"
`$env:TELEGRAM_BOT_TOKEN = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
`$env:TELEGRAM_CHAT_ID = "${{ secrets.TELEGRAM_CHAT_ID }}"
"@
          
          # Salvar config
          New-Item -ItemType Directory -Path "agents" -Force | Out-Null
          $configContent | Out-File "agents/config.local.ps1" -Encoding UTF8 -Force
          
          Write-Host "Config criado com sucesso"
      
      - name: Executar Risk Manager
        shell: pwsh
        run: |
          try {
            Write-Host "Iniciando Risk Manager..."
            
            # Verificar se config existe
            if (-not (Test-Path "agents/config.local.ps1")) {
              throw "Config não encontrado"
            }
            
            # Executar script
            & ./scripts/position_risk_cron.ps1
            
            Write-Host "✓ Risk Manager executado com sucesso"
          } catch {
            $errorMsg = "Erro: $_`nStack: $($_.ScriptStackTrace)"
            Write-Host $errorMsg
            $errorMsg | Out-File "error.log" -Encoding UTF8
            exit 1
          }
      
      - name: Enviar alerta se falhar
        if: failure()
        shell: pwsh
        run: |
          try {
            $token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            $chatId = "${{ secrets.TELEGRAM_CHAT_ID }}"
            
            # Obter logs do erro
            $errorLog = Get-Content "error.log" -ErrorAction SilentlyContinue
            $errorMsg = if ($errorLog) { $errorLog -join "`n" } else { "Erro desconhecido" }
            
            $message = "==========================`n"
            $message += ">> GITHUB ACTIONS ERRO <<`n"
            $message += "==========================`n`n"
            $message += "Job: Risk Manager`n"
            $message += "Status: FALHOU`n`n"
            $message += "Erro: $($errorMsg.Substring(0, [Math]::Min(200, $errorMsg.Length)))`n`n"
            $message += "Verifique: https://github.com/ThiagoDataEngineer/ManuHeadFund/actions"
            
            $body = @{
              chat_id = $chatId
              text = $message
            } | ConvertTo-Json
            
            Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/sendMessage" `
              -Method Post -Body $body -ContentType "application/json" | Out-Null
          } catch {
            Write-Host "Falha ao enviar alerta: $_"
          }

  dashboard-generator:
    name: Dashboard Generator
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion) instalado"
      
      - name: Configurar credenciais
        shell: pwsh
        run: |
          # Criar config.local.ps1 no formato correto
          $configContent = @"
# config.local.ps1 - GitHub Actions
`$env:COINEX_ACCESS_ID = "${{ secrets.COINEX_ACCESS_ID }}"
`$env:COINEX_SECRET_KEY = "${{ secrets.COINEX_SECRET_KEY }}"
`$env:TELEGRAM_BOT_TOKEN = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
`$env:TELEGRAM_CHAT_ID = "${{ secrets.TELEGRAM_CHAT_ID }}"
"@
          
          # Salvar config
          New-Item -ItemType Directory -Path "agents" -Force | Out-Null
          $configContent | Out-File "agents/config.local.ps1" -Encoding UTF8 -Force
          
          Write-Host "Config criado com sucesso"
      
      - name: Gerar Dashboard
        shell: pwsh
        run: |
          try {
            Write-Host "Gerando Dashboard..."
            
            # Verificar se config existe
            if (-not (Test-Path "agents/config.local.ps1")) {
              throw "Config não encontrado"
            }
            
            # Executar script
            & ./scripts/generate_dashboard_elite.ps1
            
            Write-Host "✓ Dashboard gerado com sucesso"
          } catch {
            Write-Host "✗ Erro: $_"
            Write-Host "Stack: $($_.ScriptStackTrace)"
            exit 1
          }
      
      - name: Upload Dashboard como artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard/index.html
          retention-days: 7
      
      - name: Deploy para GitHub Pages (opcional)
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages

  trailing-stop-monitor:
    name: Trailing Stop Monitor
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion) instalado"
      
      - name: Configurar credenciais
        shell: pwsh
        run: |
          # Criar config.local.ps1 no formato correto
          $configContent = @"
# config.local.ps1 - GitHub Actions
`$env:COINEX_ACCESS_ID = "${{ secrets.COINEX_ACCESS_ID }}"
`$env:COINEX_SECRET_KEY = "${{ secrets.COINEX_SECRET_KEY }}"
`$env:TELEGRAM_BOT_TOKEN = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
`$env:TELEGRAM_CHAT_ID = "${{ secrets.TELEGRAM_CHAT_ID }}"
"@
          
          # Salvar config
          New-Item -ItemType Directory -Path "agents" -Force | Out-Null
          $configContent | Out-File "agents/config.local.ps1" -Encoding UTF8 -Force
          
          Write-Host "Config criado com sucesso"
      
      - name: Executar Trailing Stop Monitor
        shell: pwsh
        run: |
          try {
            Write-Host "Iniciando Trailing Stop Monitor..."
            
            # Verificar se config existe
            if (-not (Test-Path "agents/config.local.ps1")) {
              throw "Config não encontrado"
            }
            
            # Executar script
            & ./scripts/trailing_stop_monitor.ps1
            
            Write-Host "✓ Trailing Stop Monitor executado com sucesso"
          } catch {
            $errorMsg = "Erro: $_`nStack: $($_.ScriptStackTrace)"
            Write-Host $errorMsg
            $errorMsg | Out-File "error_trailing.log" -Encoding UTF8
            exit 1
          }
      
      - name: Enviar alerta se falhar
        if: failure()
        shell: pwsh
        run: |
          try {
            $token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            $chatId = "${{ secrets.TELEGRAM_CHAT_ID }}"
            
            # Obter logs do erro
            $errorLog = Get-Content "error_trailing.log" -ErrorAction SilentlyContinue
            $errorMsg = if ($errorLog) { $errorLog -join "`n" } else { "Erro desconhecido" }
            
            $message = "==========================`n"
            $message += ">> TRAILING STOP ERRO <<`n"
            $message += "==========================`n`n"
            $message += "Job: Trailing Stop Monitor`n"
            $message += "Status: FALHOU`n`n"
            $message += "Erro: $($errorMsg.Substring(0, [Math]::Min(200, $errorMsg.Length)))`n`n"
            $message += "Verifique: https://github.com/ThiagoDataEngineer/ManuHeadFund/actions"
            
            $body = @{
              chat_id = $chatId
              text = $message
            } | ConvertTo-Json
            
            Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/sendMessage" `
              -Method Post -Body $body -ContentType "application/json" | Out-Null
          } catch {
            Write-Host "Falha ao enviar alerta: $_"
          }

  health-check:
    name: System Health Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Verificar API CoinEx
        shell: pwsh
        run: |
          try {
            $response = Invoke-RestMethod -Uri "https://api.coinex.com/v2/ping" -Method Get
            Write-Host "✓ CoinEx API: OK"
          } catch {
            Write-Host "✗ CoinEx API: FALHOU"
            exit 1
          }
      
      - name: Verificar Telegram API
        shell: pwsh
        run: |
          try {
            $token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            $response = Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/getMe" -Method Get
            Write-Host "✓ Telegram API: OK - Bot: $($response.result.username)"
          } catch {
            Write-Host "✗ Telegram API: FALHOU"
            exit 1
          }
      
      - name: Enviar status diário
        if: github.event.schedule == '0 0 * * *'
        shell: pwsh
        run: |
          $token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          $chatId = "${{ secrets.TELEGRAM_CHAT_ID }}"
          $message = "✅ *Sistema Operacional*`n`nGitHub Actions rodando normalmente.`n`nTodos os serviços OK."
          
          $body = @{
            chat_id = $chatId
            text = $message
            parse_mode = "Markdown"
          } | ConvertTo-Json
          
          Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/sendMessage" `
            -Method Post -Body $body -ContentType "application/json"
