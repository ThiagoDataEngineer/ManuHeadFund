          # 2026-06-18 Fase 2: creds Supabase em TODOS os jobs -> trailing/risk/dashboard
          # leem posicoes do state_store (a nuvem stateless nao ve o JSON local gitignored).
          $content += "`$env:SUPABASE_URL = '${{ secrets.SUPABASE_URL }}'" + "`n"
          $content += "`$env:SUPABASE_ANON_KEY = '${{ secrets.SUPABASE_ANON_KEY }}'" + "`n"
          $content += "`$env:SUPABASE_SERVICE_KEY = '${{ secrets.SUPABASE_SERVICE_KEY }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8
      
      - name: Run
        shell: pwsh
        run: |
          try {
            # 2026-06-22: gate $minute -eq 0 NUNCA casava (GH throttle nunca cai no :00
            # exato) -> short scanner rodou 0x. Fix: roda em todo fire (sem gate de minuto).
            # 2026-07-25: short_scanner.ps1 executa ordem SHORT real (nao so observatorio)
            # quando Tier S + market em tier_a_live (config/short_universe.json) + todos os
            # gates passam (plano valido, capital safety, funding-squeeze guard, sem posicao).
            if ($true) {
              Write-Host "=== SHORT SCANNER ===" -ForegroundColor Cyan
              & ./scripts/short_scanner.ps1
              Write-Host "OK" -ForegroundColor Green
            }
          } catch {
            Write-Host "ERRO: $_" -ForegroundColor Red
          }

  # ============================================================================
  # JOB 5+6: GEM SCANNER+EXECUTOR FUNDIDO (a cada 5min) — EXECUTA TRADES REAIS!
  # 2026-07-16: Fusao do par gem-scanner/gem-executor (jobs separados via fila
