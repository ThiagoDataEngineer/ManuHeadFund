          $content += "`$env:COINEX_SECRET_KEY = '${{ secrets.COINEX_SECRET_KEY }}'" + "`n"
          $content += "`$env:TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}'" + "`n"
          $content += "`$env:TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}'" + "`n"
          # 2026-06-18 Fase 2: creds Supabase em TODOS os jobs -> trailing/risk/dashboard
          # leem posicoes do state_store (a nuvem stateless nao ve o JSON local gitignored).
          $content += "`$env:SUPABASE_URL = '${{ secrets.SUPABASE_URL }}'" + "`n"
          $content += "`$env:SUPABASE_ANON_KEY = '${{ secrets.SUPABASE_ANON_KEY }}'" + "`n"
          $content += "`$env:SUPABASE_SERVICE_KEY = '${{ secrets.SUPABASE_SERVICE_KEY }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8
      
      - name: Run
        shell: pwsh
        run: |
          try {
            # 2026-06-22: gate %15==0 (exato) raramente casava sob GH throttle. Risk mgmt
            # quer frequencia e e idempotente -> roda em todo fire.
            if ($true) {
              Write-Host "=== POSITION RISK ===" -ForegroundColor Cyan
              & ./scripts/position_risk_cron.ps1
              Write-Host "OK" -ForegroundColor Green
            }
          } catch {
            Write-Host "ERRO: $_" -ForegroundColor Red
            throw
          }
  
  # ============================================================================
  # JOB 3: DASHBOARD (a cada 5min)
  # ============================================================================
  dashboard:
    name: Dashboard Generator
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "agents","journal","logs","dashboard" -Force | Out-Null
          $content = "`$env:COINEX_ACCESS_ID = '${{ secrets.COINEX_ACCESS_ID }}'" + "`n"
          $content += "`$env:COINEX_SECRET_KEY = '${{ secrets.COINEX_SECRET_KEY }}'" + "`n"
          $content += "`$env:TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}'" + "`n"
          $content += "`$env:TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}'" + "`n"
          # 2026-06-18 Fase 2: creds Supabase em TODOS os jobs -> trailing/risk/dashboard
          # leem posicoes do state_store (a nuvem stateless nao ve o JSON local gitignored).
          $content += "`$env:SUPABASE_URL = '${{ secrets.SUPABASE_URL }}'" + "`n"
          $content += "`$env:SUPABASE_ANON_KEY = '${{ secrets.SUPABASE_ANON_KEY }}'" + "`n"
          $content += "`$env:SUPABASE_SERVICE_KEY = '${{ secrets.SUPABASE_SERVICE_KEY }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8
      
      - name: Run
        shell: pwsh
        run: |
          try {
            Write-Host "=== DASHBOARD ===" -ForegroundColor Cyan
            & ./scripts/collect_dashboard_data.ps1
            Write-Host "OK" -ForegroundColor Green
          } catch {
            Write-Host "ERRO: $_" -ForegroundColor Red
          }
      
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_number }}
          path: dashboard/
          retention-days: 7
  
  # ============================================================================
  # JOB 4: DEPLOY DASHBOARD TO GITHUB PAGES
  # ============================================================================
  deploy-dashboard:
    name: Deploy Dashboard to GitHub Pages
    runs-on: ubuntu-latest
    needs: [dashboard]
    if: success()
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard-${{ github.run_number }}
          path: ./public
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
  
  # ============================================================================
  # JOB 5: SHORT SCANNER (a cada hora)
  # ============================================================================
  short-scanner:
    name: Short Scanner
    runs-on: ubuntu-latest
    
    steps:
