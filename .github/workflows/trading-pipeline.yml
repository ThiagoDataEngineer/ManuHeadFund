          $content | Out-File "agents/config.local.ps1" -Encoding UTF8

      - name: Run Conviction Scan (hourly, observe)
        shell: pwsh
        continue-on-error: true
        run: |
          # 2026-07-27 FIX: gate "$minute -ge 20 -and $minute -lt 25" NUNCA casava
          # (GH Actions throttle nao cai numa janela de 5min exata -- mesmo bug ja
          # documentado/corrigido em short_scanner.ps1 07-25). Confirmado real:
          # 19 disparos consecutivos das ultimas 15h, ZERO no minuto 20-24 --
          # conviction_observations ficou vazia mesmo apos criar a tabela (fix
          # 2026-07-26), porque o job "existia" mas nunca de fato rodava.
          # cron_guard.ps1 (mesmo padrao ja usado por mce_counterfactual/
          # staleness_audit) persiste o ultimo run real no Supabase, robusto a
          # throttle.
          & ./scripts/cron_guard.ps1 -JobId "cloud_conviction_scan" -Schedule "interval:60"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "=== CLOUD CONVICTION SCAN (OBSERVE) ===" -ForegroundColor Cyan
            try {
              & ./scripts/cloud_conviction_scan.ps1
              Write-Host "OK" -ForegroundColor Green
            } catch {
              Write-Host "WARN: $_" -ForegroundColor Yellow
            }
          }

  # ============================================================================
  # JOB 5: LEARNING CYCLE (Counterfactual — a cada 30min)
  # 2026-06-09: Computa stats dos snapshots+outcomes+skips periodicamente
  # ============================================================================
  learning-cycle:
    name: Learning Cycle (Retroalimentacao)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "agents","journal","logs" -Force | Out-Null
          # 2026-07-17 FIX: sem credenciais Supabase, cron_guard nao consegue
          # persistir last_run_utc -- pra schedule "interval" (nao daily/weekly)
          # isso faz TODO ciclo ser considerado "due" (sem historico pra
          # comparar), perdendo o dedup real de 30min. Invoke-LearningCycle
          # tambem precisa de Supabase pra ler trade_rejections (Parte 2 do
          # ciclo, aprendizado de skips). Mesmo padrao de credenciais que
          # layer2_mentor/mce_counterfactual ja usam.
          $content = "`$env:COINEX_ACCESS_ID = '${{ secrets.COINEX_ACCESS_ID }}'" + "`n"
          $content += "`$env:COINEX_SECRET_KEY = '${{ secrets.COINEX_SECRET_KEY }}'" + "`n"
          $content += "`$env:SUPABASE_URL = '${{ secrets.SUPABASE_URL }}'" + "`n"
          $content += "`$env:SUPABASE_ANON_KEY = '${{ secrets.SUPABASE_ANON_KEY }}'" + "`n"
          $content += "`$env:SUPABASE_SERVICE_KEY = '${{ secrets.SUPABASE_SERVICE_KEY }}'" + "`n"
          $content | Out-File "agents/config.local.ps1" -Encoding UTF8

      - name: Run Learning Cycle (a cada 30min)
        shell: pwsh
        continue-on-error: true  # cron_guard SKIP sai exit 1 -- sem isso o job falha falso
        run: |
          # 2026-07-17 FIX: gate de minuto exato ($minute -in @(0,30)) e
          # estruturalmente quase impossivel de bater -- o cron real do GH
          # Actions tem throttle de ~5-35min (nunca minuto redondo) mais o
          # delay real de setup (~15-60s) entre trigger e execucao do step.
          # Confirmado em 100 runs recentes: so 2% bateram o minuto exato, e
          # mesmo esses as vezes nao executavam por causa do delay. Resultado
          # pratico: Invoke-LearningCycle (consolidador de aprendizado de
          # trades+skips) quase NUNCA rodava o corpo real -- mesmo padrao de
          # bug ja corrigido em layer2_mentor/mce_counterfactual (commit
          # historico "cron_guard 30min robusto a throttle"). Trocado pro
          # mesmo cron_guard robusto (baseado em timestamp real via Supabase,
          # nao minuto do relogio).
          try {
            & ./scripts/cron_guard.ps1 -JobId "learning_cycle" -Schedule "interval:30"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "=== LEARNING CYCLE ===" -ForegroundColor Cyan
              . agents/lib_learning_scheduler.ps1
              Invoke-LearningCycle -JournalDir "journal"
              Write-Host "✓ Learning cycle complete" -ForegroundColor Green
            }
          } catch {
            Write-Host "WARN: Learning cycle failed: $_" -ForegroundColor Yellow
          }
          # 2026-07-17: Evolution Engine existia desde 2026-06-04/07-09
          # (agents/lib_evolution_engine.ps1, TDD 21/21, bounds duplos +
          # anti-oscilacao + auditoria completa) mas Invoke-EvolutionCycle so
          # estava wired em scripts/self_heal_guardian.ps1 -- que so roda via
          # start_fleet.ps1 (BOOT LOCAL), nunca na nuvem. Mesmo padrao de
          # peca-de-seguranca-nunca-ligada achado 3x hoje (leverage). Cron
          # proprio (nao o mesmo guard do Learning Cycle) pra nao acoplar
          # falha de um ao outro; roda a cada 6h (parametros de deteccao
          # mudam devagar por design, ver Get-TunableRegistry).
          try {
            & ./scripts/cron_guard.ps1 -JobId "evolution_cycle" -Schedule "interval:360"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "=== EVOLUTION CYCLE ===" -ForegroundColor Cyan
              . agents/lib_evolution_engine.ps1
              . agents/lib_direction_learning.ps1 2>$null
              $evoResult = Invoke-EvolutionCycle -JournalDir "journal" -LogsDir "logs"
              if ($evoResult.applied.Count -gt 0) {
                Write-Host "  Aplicadas: $($evoResult.applied.Count)" -ForegroundColor Green
                $evoResult.applied | ForEach-Object { Write-Host "    $($_.param): $($_.before) -> $($_.after) ($($_.reason))" -ForegroundColor Yellow }
              }
              if ($evoResult.frozen.Count -gt 0) {
                Write-Host "  Congeladas (anti-oscilacao): $($evoResult.frozen.Count)" -ForegroundColor DarkYellow
              }
              if ($evoResult.owner_pending.Count -gt 0) {
                Write-Host "  Pendentes de aprovacao (risk): $($evoResult.owner_pending.Count)" -ForegroundColor Magenta
              }
              Write-Host "✓ Evolution cycle complete" -ForegroundColor Green
            }
          } catch {
            Write-Host "WARN: Evolution cycle failed: $_" -ForegroundColor Yellow
          }
          exit 0

