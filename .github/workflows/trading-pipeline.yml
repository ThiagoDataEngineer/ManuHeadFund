        run: |
          Write-Host "=== GEM SCANNER+EXECUTOR (LIVE TRADING) ===" -ForegroundColor Green
          try {
            & ./scripts/gem_scanner_executor_live.ps1 -AutoExecute $true
            Write-Host "Execution cycle complete" -ForegroundColor Green
          } catch {
