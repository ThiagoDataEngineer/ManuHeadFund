name: Heartbeat Monitor — Is System Alive?

on:
  schedule:
    - cron: '0 * * * *'  # Every hour at :00
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  heartbeat-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check pipeline liveness (NUNCA falha o run)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 2026-06-25 redesign. O heartbeat antigo lia trade_outcomes do Supabase,
          # mas essa tabela esta AUSENTE (PGRST205) -> no runner cloud nao ha fallback
          # JSONL -> via 0 outcomes -> exit 1 TODA HORA -> spam de email "Run failed" +
          # alerta Telegram. Pior: "nenhum trade fechou em 6h" != "sistema morto"
          # (o sistema e seletivo e segura posicoes em trailing).
          #
          # Novo sinal de "vivo": o PROPRIO trading-pipeline. Ele roda a cada 5min;
          # se nao rodou na ultima StaleHours, o sistema esta REALMENTE parado.
          # Independe do Supabase. E o job NUNCA falha (exit 0) -> zero email-spam;
          # so alerta via Telegram quando genuinamente morto.
          $StaleHours = 2.0   # 5min/ciclo; folga p/ throttle do schedule do GitHub
          $repo = "${{ github.repository }}"
          $uri  = "https://api.github.com/repos/$repo/actions/workflows/trading-pipeline.yml/runs?per_page=1"
          $headers = @{
            Authorization  = "Bearer $env:GH_TOKEN"
            Accept         = "application/vnd.github+json"
            "User-Agent"   = "manuheadfund-heartbeat"
          }

          $lastRunUtc = $null
          try {
            $resp = Invoke-RestMethod -Uri $uri -Headers $headers -Method GET
            if ($resp.workflow_runs -and $resp.workflow_runs.Count -gt 0) {
              $lastRunUtc = [datetime]::Parse(
                $resp.workflow_runs[0].created_at,
                [System.Globalization.CultureInfo]::InvariantCulture,
                [System.Globalization.DateTimeStyles]::AdjustToUniversal)
            }
          } catch {
            Write-Host "[WARN] nao consegui consultar runs do pipeline: $_" -ForegroundColor Yellow
          }

          $alert = $false; $reason = ""
          if ($null -eq $lastRunUtc) {
            $alert = $true; $reason = "nenhum run do trading-pipeline encontrado"
          } else {
            $hours = ([datetime]::UtcNow - $lastRunUtc).TotalHours
            $h = [math]::Round($hours, 2)
            if ($hours -gt $StaleHours) {
              $alert = $true; $reason = "pipeline sem rodar ha ${h}h (limite ${StaleHours}h)"
            } else {
              Write-Host "[OK] sistema vivo: trading-pipeline rodou ha ${h}h" -ForegroundColor Green
            }
          }

          if ($alert) {
            Write-Host "[ALERT] $reason" -ForegroundColor Red
            if ($env:TELEGRAM_BOT_TOKEN -and $env:TELEGRAM_CHAT_ID) {
              $msg  = "ALERTA HEARTBEAT: sistema parado? $reason`nRepo: $repo`nVerifique o trading-pipeline em Actions."
              $turi = "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage"
              $body = @{ chat_id = $env:TELEGRAM_CHAT_ID; text = $msg } | ConvertTo-Json
              try { Invoke-RestMethod -Uri $turi -Method POST -Body $body -ContentType "application/json" | Out-Null } catch {}
            }
          }

          # SEMPRE verde: o heartbeat nunca deve falhar o run (era a causa do email-spam).
          exit 0
