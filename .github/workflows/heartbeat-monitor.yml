name: Heartbeat Monitor — Is System Alive?

on:
  schedule:
    - cron: '0 * * * *'  # Every hour at :00
  workflow_dispatch:

jobs:
  heartbeat-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PowerShell
        uses: PowerShell/setup-powershell@v2
        with:
          pwsh-version: latest

      - name: Load credentials
        shell: pwsh
        run: |
          # Load local config for Telegram
          if (Test-Path agents/config.local.ps1) {
            . agents/config.local.ps1
            echo "TELEGRAM_BOT_TOKEN=$env:TELEGRAM_BOT_TOKEN" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            echo "TELEGRAM_CHAT_ID=$env:TELEGRAM_CHAT_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Check system heartbeat
        shell: pwsh
        run: |
          Write-Host "Checking if system is alive..."
          & ./scripts/heartbeat_alert.ps1 -AlertThresholdHours 6

          $exit_code = $LASTEXITCODE

          if ($exit_code -eq 0) {
            Write-Host "✓ System is alive" -ForegroundColor Green
          } else {
            Write-Host "✗ System appears to be broken" -ForegroundColor Red
          }

          exit $exit_code

      - name: Notify success
        if: success()
        shell: pwsh
        run: |
          Write-Host "✓ Heartbeat check PASSED" -ForegroundColor Green

      - name: Notify failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "✗ Heartbeat check FAILED — system may be broken" -ForegroundColor Red
